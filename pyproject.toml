[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-prediction"
version = "0.1.0"
description = "Dataset audit and preprocessing for the UCI Cleveland heart disease dataset"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
modeling = ["joblib>=1.3,<2", "xgboost>=3,<4", "matplotlib>=3.10,<4"]
app = ["streamlit>=1.50,<2", "joblib>=1.3,<2"]
tracking = ["SQLAlchemy>=2,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "joblib>=1.3,<2"]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
